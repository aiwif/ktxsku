<style>
:root{--bg:#f3f5f8;--panel:#fff;--text:#1b2230;--muted:#6a7383;--line:#d9dee7;--accent:#0b63c5;--accent-t:#fff;--hover:#eaf2fd;--na-bg:#f1f2f4;--na-text:#a3a9b5;--na-line:#d5d8de;--note:#fff1b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#13161b;--panel:#1c2027;--text:#e8eaee;--muted:#9aa3b2;--line:#2f3540;--accent:#5aa7ff;--accent-t:#0c1117;--hover:#1f2c3f;--na-bg:#191c21;--na-text:#4f5663;--na-line:#2a2f37;--note:#4d3f0c}}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 2px}
h1{font-size:17px;margin:0;flex:1}
#tabs{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto}
#tabs button{color:var(--muted);background:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:9px 14px;white-space:nowrap}
#tabs button:hover{background:var(--hover)}
#tabs button[aria-selected="true"]{color:var(--text);font-weight:700;background:var(--bg);border-color:var(--line);margin-bottom:-1px}
#tabs .n{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
#meta{padding:10px 16px 0;color:var(--muted);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:12px 16px 24px}
.blk{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;align-self:start;overflow:hidden}
.blk.open{border-color:var(--accent)}
.head{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:10px 12px;min-height:76px;position:relative;background:none;border:0;color:inherit}
.head:hover,.head:focus-visible{background:var(--hover);outline:none}
.no{font-size:12px;color:var(--muted)}
.sku{font-size:18px;font-weight:700;word-break:break-all;line-height:1.25;padding-right:22px}
.asin{font:13px ui-monospace,Consolas,monospace;color:var(--muted)}
.ic{position:absolute;right:12px;top:10px;color:var(--accent)}
.pic{padding:0 10px 10px}
.pic img{width:100%;height:auto;display:block;background:#fff;border-radius:6px;cursor:pointer}
.pic .msg{color:var(--muted);font-size:13px;word-break:break-all}
.pic .links{display:flex;gap:10px;justify-content:space-between;margin-top:6px;font-size:13px}
.pic .links span{color:var(--muted)}
.pic a{color:var(--accent);text-decoration:none}
.blk.na{background:var(--na-bg);border:1px dashed var(--na-line);border-left:5px solid var(--na-line)}
.blk.na .head{cursor:default}
.blk.na .head:hover{background:none}
.blk.na .no,.blk.na .sku,.blk.na .asin{color:var(--na-text)}
.blk.na .sku{font-weight:700}
</style>
</head>

var $ = function (id) { return document.getElementById(id); };
var byId = {};
DATA.rows.forEach(function (r) { byId[r[0]] = r; });

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function block(grid, r) {
  var url = r[3];
  var b = el("div", "blk" + (url ? "" : " na"));
  var h = el("button", "head");
  h.type = "button";
  h.appendChild(el("div", "no", "#" + r[0]));
  h.appendChild(el("div", "sku", r[1]));
  h.appendChild(el("div", "asin", r[2] || "#N/A"));
  b.appendChild(h);
  grid.appendChild(b);
  if (!url) { h.title = "No image available"; return false; }

  var ic = el("span", "ic", "▾");
  h.appendChild(ic);
  h.setAttribute("aria-expanded", "false");
  var pic = el("div", "pic"), img = el("img"), msg = el("div", "msg"), links = el("div", "links");
  pic.hidden = true;
  img.alt = r[1]; img.title = "Click to hide"; img.referrerPolicy = "no-referrer"; img.hidden = true;
  var loaded = false;
  img.onload = function () { img.hidden = false; msg.textContent = ""; };
  img.onerror = function () { img.hidden = true; loaded = false; msg.textContent = "The image could not be loaded."; };
  if (r[2]) {
    var a = el("a", "", "Amazon page ↗");
    a.href = "https://www.amazon.com/dp/" + r[2]; a.target = "_blank"; a.rel = "noopener noreferrer";
    links.appendChild(a);
  } else links.appendChild(el("span", "", "No Amazon link"));
  pic.appendChild(img); pic.appendChild(msg); pic.appendChild(links);
  b.appendChild(pic);

    h.setAttribute("aria-expanded", openIt ? "true" : "false");
    ic.textContent = openIt ? "▴" : "▾";
    if (openIt && !loaded) { loaded = true; msg.textContent = "Loading..."; img.src = url; }
  }
  h.onclick = function () { toggle(pic.hidden); };
  img.onclick = function () { toggle(false); };
  return true;
}

function show(i) {

  var list = t.ids ? t.ids.map(function (id) { return byId[id]; }) : DATA.rows;

  });
  window.scrollTo(0, 0);
}

DATA.tabs.forEach(function (t, i) {

});
